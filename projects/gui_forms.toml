# GUI.Forms' project file (harness/project.py reads it).
#
# Every value reproduces a name GUI.Forms' CI used before the harness
# existed, so its caches, receipts and toolchain releases stay valid:
# harness/test_project_names.py checks the derived names byte for byte.
# Changing a value starts a new history; change one deliberately.

schema = 1

[project]
name = "gui_forms"
repository = "malkuth-software/gui_forms"
# The checkout under the workspace root (gui_forms/), and its build trees
# .build/native-<platform>/gui-forms/ (-sanitize, -sdk).
source_dir = "gui_forms"
build_name = "gui-forms"
# GUI_FORMS_LLVM_RUNTIME, GUI_FORMS_PLATFORM, GUI_FORMS_COMPILER_ID, ...
env_prefix = "GUI_FORMS"

[ci]
# gui-validated-, gui-inputs-, gui-tree-, gui-sanitize-ccache-linux-x64.
artifact_prefix = "gui-"
# gui-forms-cache-<platform>.tar.gz
cache_asset_prefix = "gui-forms-cache-"
native_workflow = ".github/workflows/native.yml"
native_job = "native"
pinned_cache_revisions = "packaging/pinned_cache_revisions.json"

[toolchain]
# The Windows CLANG64 toolchain is published as releases of the running
# repository: gui-forms-toolchain-windows-x64.tar.zst and its manifest,
# which records this repository as its publisher.
repository = "malkuth-software/gui_forms"
asset_prefix = "gui-forms-toolchain-"

[tests]
areas_file = "tools/test_areas.json"
# tests/X.cpp names the tests X, gui_forms_X and gui_drawing_X.
name_prefixes = ["gui_forms_", "gui_drawing_"]

# install_linux_ci_packages.sh <profile>: toolkit (native and sanitizer jobs)
# or programs (release.yml).
#
# xcompmgr: a compositing manager for stage T5's X11 compositor probe and
# gate under Xvfb (owner decision T5-Q12). weston and xwayland: a headless
# Wayland compositor and its X server, for the same probe under XWayland
# (owner, 2026-10-25; Linux CI only).
[linux_packages.toolkit]
packages = [
    "cmake", "ninja-build", "ccache", "clang-22", "generate-ninja", "pkg-config",
    "libx11-dev", "libxext-dev", "libxrandr-dev", "libxcursor-dev", "libxfixes-dev", "libxi-dev",
    "libatk1.0-dev", "libatk-bridge2.0-dev",
    "xvfb", "xauth", "xcompmgr", "weston", "xwayland", "xdg-utils", "dbus", "at-spi2-core",
    "python3-gi", "gir1.2-atspi-2.0",
]

[linux_packages.programs]
extends = "toolkit"
packages = ["xdotool", "patchelf", "dpkg-dev"]

[state_machines]
first_party_dirs = [
    "include", "src", "demo", "tests", "examples", "tools",
    "file_manager_demoboard", "stx_vorbis", "stx_zlib", "stx_png", "stx_conv",
    "fuzz",
]
# The atom vocabulary: PartRole, AnatomyState, SemanticRole, PartMark,
# ControlVisualRole and their neighbours.
vocabulary_headers = [
    "include/gui_forms/anatomy/types/anatomy_types.hpp",
    "include/gui_forms/semantics/types/semantic_types.hpp",
    "include/gui_forms/theme/part_painting/part_painting.hpp",
    "include/gui_forms/theme/types/theme_types.hpp",
]
# Owning areas by path prefix, most specific first (AGENTS.md ownership).
areas = [
    ["include/gui_forms/controls/", "controls"],
    ["src/controls/", "controls"],
    ["demo/", "controls"],
    ["src/host/windows/", "host-windows"],
    ["src/host/macos/", "host-macos"],
    ["src/host/linux/", "host-linux"],
    ["src/host/", "host"],
    ["src/render/", "render"],
    ["src/abi/", "c-abi"],
    ["src/audio/", "audio"],
    ["src/runtime/", "runtime"],
    ["src/core/", "core"],
    ["include/", "core"],
    ["tests/", "tests"],
    ["file_manager_demoboard/", "demoboard"],
    ["stx_vorbis/", "stx_vorbis"],
    ["stx_zlib/", "stx_zlib"],
    ["stx_png/", "stx_png"],
    ["stx_conv/", "stx_conv"],
    ["fuzz/", "fuzz"],
    ["examples/", "examples"],
    ["tools/", "tools"],
]
# A change to one of these can change any verdict: a changed-code run checks
# the full tree. GUI.Forms' tools/check_*.py are forwarding shims to this
# harness, so a change to the checkers reaches GUI.Forms as a harness.lock
# bump (tools/harness_link.py is how the shims reach it).
full_tree_triggers = [
    "tools/check_state_machines.py",
    "tools/check_house_style.py",
    ".github/workflows/state-machines.yml",
    "harness.lock",
    "tools/harness_link.py",
]
# C3 records reviewed and kept, each [path, record, reason].
reviewed_shapes = [
    ["include/gui_forms/typography/types/typography_types.hpp", "ResolvedTextLayout",
     "design_metrics follows the measuring engine, not the status grade: a broad-form case, kept for the owner's decision"],
]

[loop_branches]
# check_loop_branches.py (E2): the recorded keep, hoist and false_shape
# decisions, maintained with the repairs in the GUI.Forms checkout.
decisions = "tools/loop_branch_decisions.json"

[build]
# GUI_FORMS_SYSTEM_BUILD_TOOLS changes what a configure records
# (ci_build_steps.configure_record); GUI_FORMS_LLVM_RUNTIME always does.
configure_variables = ["SYSTEM_BUILD_TOOLS"]

# cache_manifest.py records these in cache-manifest.json beside the cache.
[cache_manifest]
profile = "native Release plus separately tested development text/host profiles"

# The native job's build options, in the order the manifest lists them.
# harfbuzz: ADR-004, every host draws text with the shared HarfBuzz/FreeType engine.
[cache_manifest.native_options]
build_type = "Release"
cxx_standard = 20
pic = true
audio = true
tests = true
gallery = false
skia = true
harfbuzz = true

# The Windows build has no Skia.
[cache_manifest.platform_options."windows-x64"]
skia = false

# checkpoint/checkpoint.py: the coordinator's integration workspace (run with
# HARNESS_WORKSPACE set to it, D:/gui_forms_int today) holds the integration
# tree, a dedicated clone marked by `checkpoint init`, and build.sh, which
# configures and builds the tree and, with `all`, runs the whole ctest suite.
[checkpoint]
tree = "gui_forms"
verify = ["sh", "build.sh", "all"]
base = "main"
remote = "origin"
branch_prefix = "checkpoint/"
merge_method = "merge"

# harness/bootstrap.py: the notes clone (main, plus the gui_forms side branch
# as the worktree notes-gui_forms), the in-house projects repository, and the
# smoke build: ci_build.py configures as CI does, then a plain (not
# sanitized) build of only what gui_forms_core_tests reads, and that test;
# without --sanitize, --tests installs nothing (GUI.Forms #408 admitted it).
# {python} is the interpreter running the bootstrap.
[bootstrap]
notes_repository = "malkuth-software/notes"
notes_branch = "gui_forms"
projects_repository = "malkuth-software/projects"
smoke = ["{python}", "gui_forms/tools/ci_build.py", "--tests", "^gui_forms_core_tests$"]
