name: CI
# {{title}} through template_harness's reusable workflows, at the commit
# harness.lock pins. Every `@<commit>` below must equal harness.lock: bump
# them together (template_harness docs/adopting.md §4). The project file is
# template_harness/projects/{{app}}.toml; its [ci] native_workflow and
# native_job name this file and the `native` job.
#
# Each job builds GUI.Forms from the source SDK pinned in gui_forms.lock
# (fetch_sdk.py) into .harness-cache/, kept in an Actions cache keyed by the
# lock and the compiler identity.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the SDK fetch
        run: python3 -B -m unittest discover -s . -p "test_*.py"
  house-style:
    uses: {{harness_repository}}/.github/workflows/harness-house-style.yml@{{harness_commit}}
    with:
      product_path: {{app}}
      paths: src tests
      lifetime_paths: src tests
  state-machines:
    uses: {{harness_repository}}/.github/workflows/harness-state-machines.yml@{{harness_commit}}
    with:
      product_path: {{app}}
      project: template_harness/projects/{{app}}.toml
      linux_profile: consumer
      configure_command: python3 {{app}}/ci_build.py --configure-only --allow-network-inputs
      build_dir: .build/native-linux-x64/{{build_name}}
      timeout_minutes: 90
      install_cache_paths: |
        .harness-cache/gui-forms-[0-9]*
        !.harness-cache/*.work
      install_cache_key_files: {{app}}/gui_forms.lock
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            shell: bash
    uses: {{harness_repository}}/.github/workflows/harness-native.yml@{{harness_commit}}
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      shell: ${{ matrix.shell }}
      product_path: {{app}}
      project: template_harness/projects/{{app}}.toml
      linux_profile: consumer
      build_command: python {{app}}/ci_build.py --jobs 4 --allow-network-inputs
      timeout_minutes: 90
      install_cache_paths: |
        .harness-cache/gui-forms-[0-9]*
        !.harness-cache/*.work
      install_cache_key_files: {{app}}/gui_forms.lock
