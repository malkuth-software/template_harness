name: Harness state-machine gate
# House style section 2 for new code: harness/check_state_machines.py fails on
# any F1 (a switch without a default, not in the compliant form) or F2 (a
# default that hides enumerators without a stated reason) in the translation
# units a change can affect. The project file's [state_machines] table names
# the first-party directories and areas, and its source_dir the root.
#
#   jobs:
#     state-machines:
#       uses: malkuth-software/template_harness/.github/workflows/harness-state-machines.yml@<commit>
#       with:
#         product_path: my_product
#         project: my_product/harness.toml
#         configure_command: cmake -S my_product -B build -G Ninja ...
#         build_dir: build
#
# Scopes: a pull request checks what its C and C++ changes can affect against
# its base, a merge group against the main commit it extends and a push
# against the commit it replaced, and each passes at once when it changes no
# C or C++ file. A manual or scheduled run, a push without a usable base and
# a change to a full-tree trigger check the whole tree.
#
# One Linux host: the configure command needs only to write the tree's
# compile commands (and any generated headers the checker builds), from the
# workspace root, with the project's [linux_packages.<linux_profile>]
# installed.
on:
  workflow_call:
    inputs:
      product_path:
        description: The product's checkout directory under the workspace root
        type: string
        required: true
      project:
        description: The project file, relative to the workspace root
        type: string
        required: true
      configure_command:
        description: Configures a Ninja tree with compile commands, run from the workspace root
        type: string
        required: true
      build_dir:
        description: The configured tree, relative to the workspace root
        type: string
        required: true
      harness_path:
        description: The harness checkout directory under the workspace root
        type: string
        default: template_harness
      harness_lock:
        description: The harness pin, relative to the product checkout
        type: string
        default: harness.lock
      linux_profile:
        description: The project file's [linux_packages.<profile>] the configure step needs
        type: string
        default: toolkit
      timeout_minutes:
        type: number
        default: 30
      install_cache_paths:
        description: >-
          Installs the configure command makes under HARNESS_CACHE (.harness-cache/ at the workspace root) and
          reuses while their inputs match, such as a dependency built from source; actions/cache paths,
          relative to the workspace root, one per line. Empty caches none.
        type: string
        default: ''
      install_cache_key_files:
        description: One hashFiles pattern naming those installs' inputs (for example a lock file)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  state-machines:
    name: state-machine-gate
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      HARNESS_WORKSPACE: ${{ github.workspace }}
      HARNESS_PROJECT: ${{ github.workspace }}/${{ inputs.project }}
      HARNESS_ROOT: ${{ github.workspace }}/${{ inputs.harness_path }}
      HARNESS_CACHE: ${{ github.workspace }}/.harness-cache
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      # The whole history, so the changed paths come from the merge base.
      - uses: actions/checkout@v4
        with:
          path: ${{ inputs.product_path }}
          fetch-depth: 0
      - name: Read the harness pin
        id: pin
        if: inputs.harness_path != inputs.product_path
        env:
          LOCK: ${{ inputs.product_path }}/${{ inputs.harness_lock }}
        run: |
          python3 - "$LOCK" <<'EOF'
          import os, sys, tomllib
          with open(sys.argv[1], 'rb') as handle:
              pin = tomllib.load(handle)['harness']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('repository=' + pin['repository'] + '\n')
              output.write('commit=' + pin['commit'] + '\n')
          EOF
      - uses: actions/checkout@v4
        if: inputs.harness_path != inputs.product_path
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: ${{ inputs.harness_path }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find the changed C and C++ files
        id: scope
        env:
          PRODUCT_PATH: ${{ inputs.product_path }}
        run: |
          scope=full
          if [ "$GITHUB_EVENT_NAME" != schedule ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] \
              && [ -n "$BASE" ] && git -C "$PRODUCT_PATH" cat-file -e "$BASE^{commit}" 2>/dev/null; then
            listed=$(python3 -B "$HARNESS_ROOT/harness/check_state_machines.py" --changed-from "$BASE" --list-changed)
            if [ -z "$listed" ]; then
              scope=none
            elif [ "$listed" != every ]; then
              scope=changed
            fi
            printf '%s\n' "$listed"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "State-machine gate scope: $scope"
      # The toolkit's own run also tests the AST reader, whatever the C++
      # scope: on a schedule or dispatch, and when the reader, its tests or
      # this workflow changed. A product's run never does.
      - name: Find whether the AST reader changed
        id: reader
        if: inputs.harness_path == inputs.product_path
        env:
          PRODUCT_PATH: ${{ inputs.product_path }}
        run: |
          changed=true
          if [ "$GITHUB_EVENT_NAME" != schedule ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]               && [ -n "$BASE" ] && git -C "$PRODUCT_PATH" cat-file -e "$BASE^{commit}" 2>/dev/null; then
            listed=$(git -C "$PRODUCT_PATH" diff --name-only "$BASE" HEAD --               harness/clang_ast.py harness/clang_ast_json.py harness/clang_ast_libclang.py               harness/test_clang_ast.py .github/workflows/harness-state-machines.yml)
            [ -n "$listed" ] || changed=false
            printf '%s
' "$listed"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "AST reader test: $changed"
      - name: Nothing to check
        if: steps.scope.outputs.scope == 'none'
        run: echo "No C or C++ file changed; the gate passes without a tree."
      # The downloaded packages are kept as in harness-native.yml: restored
      # before the installs, saved on a push when the key missed.
      - name: Name the Linux package cache
        id: linux-image
        if: (steps.scope.outputs.scope != 'none' || steps.reader.outputs.changed == 'true')
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: linux-packages
        if: (steps.scope.outputs.scope != 'none' || steps.reader.outputs.changed == 'true')
        with:
          path: ${{ runner.temp }}/apt-archives
          key: state-machines-debs-v1-${{ inputs.linux_profile }}-${{ runner.arch }}-${{ hashFiles(format('{0}/harness/install_linux_ci_packages.sh', inputs.harness_path), format('{0}/.github/workflows/harness-state-machines.yml', inputs.harness_path), inputs.project) }}-${{ steps.linux-image.outputs.image }}
          restore-keys: state-machines-debs-v1-${{ inputs.linux_profile }}-${{ runner.arch }}-
      - name: Install the configure step's packages
        if: (steps.scope.outputs.scope != 'none' || steps.reader.outputs.changed == 'true')
        env:
          PROFILE: ${{ inputs.linux_profile }}
        run: sh "$HARNESS_ROOT/harness/install_linux_ci_packages.sh" "$PROFILE" "$RUNNER_TEMP/apt-archives"
      # The shared AST reader (harness/clang_ast.py) reads through the pinned
      # LLVM's libclang: python3-clang-22, with its libclang-22-dev, from the
      # apt.llvm.org source the step above added. This is the one job that
      # installs it (owner, 2026-10-27). It goes through the same archive
      # directory, and like every apt.llvm.org package ("~++" versions) it is
      # downloaded each run rather than kept.
      - name: Install the AST reader's libclang bindings
        if: (steps.scope.outputs.scope != 'none' || steps.reader.outputs.changed == 'true')
        run: |
          archives="$RUNNER_TEMP/apt-archives"
          sudo apt-get install -y -o Dir::Cache::Archives="$archives" python3-clang-22
          sudo find "$archives" -maxdepth 1 -name '*~++*.deb' -delete
          sudo rm -f "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
      # Both backends; HARNESS_AST_READER=libclang makes a missing libclang a
      # failure, not a skip.
      - name: Test the AST reader
        if: steps.reader.outputs.changed == 'true'
        env:
          HARNESS_AST_READER: libclang
        run: python3 -B -m unittest discover -s "$HARNESS_ROOT/harness" -p test_clang_ast.py -v
      - uses: actions/cache/save@v4
        if: (steps.scope.outputs.scope != 'none' || steps.reader.outputs.changed == 'true') && github.event_name == 'push' && steps.linux-packages.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.linux-packages.outputs.cache-primary-key }}
      # As in harness-native.yml: an install the configure command builds
      # from source is reused while its inputs and the compiler match.
      - name: Identify the compiler
        id: compiler
        if: steps.scope.outputs.scope != 'none' && inputs.install_cache_paths != ''
        run: python3 "$HARNESS_ROOT/harness/compiler_identity.py"
      - uses: actions/cache@v4
        if: steps.scope.outputs.scope != 'none' && inputs.install_cache_paths != ''
        with:
          path: ${{ inputs.install_cache_paths }}
          key: state-machines-installs-v1-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles(inputs.install_cache_key_files) }}
      - name: Configure the tree
        if: steps.scope.outputs.scope != 'none'
        env:
          CONFIGURE_COMMAND: ${{ inputs.configure_command }}
          HARNESS_TOOLCHAIN_IDENTITY: ${{ steps.compiler.outputs.identity }}
        run: sh -c "$CONFIGURE_COMMAND"
      - name: Check the state machines
        if: steps.scope.outputs.scope != 'none'
        shell: bash
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
          BUILD_DIR: ${{ inputs.build_dir }}
        run: |
          set -o pipefail
          changed=()
          if [ "$SCOPE" = changed ]; then
            changed=(--changed-from "$BASE")
          fi
          python3 -B "$HARNESS_ROOT/harness/check_state_machines.py" --build-dir "$BUILD_DIR" --jobs 4 \
            --gate --json state-machines.json "${changed[@]}" | tee state-machines.txt
      - name: Show the findings
        if: always() && steps.scope.outputs.scope != 'none'
        run: |
          if [ -f state-machines.txt ]; then
            { echo '```text'; head -200 state-machines.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.scope != 'none'
        with:
          name: state-machine-findings
          path: |
            state-machines.json
            state-machines.txt
          if-no-files-found: ignore
